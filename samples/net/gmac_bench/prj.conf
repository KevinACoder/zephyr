# RK3568 DWC GMAC bench image: iperf2-speaking zperf server, static IPv4,
# Ethernet/MMC statistics readable from the shell.

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_DRIVER=y

# zperf speaks iperf2 by default; the same Pi iperf2 used for the Linux
# ground truth can drive this image.
CONFIG_NET_ZPERF=y
CONFIG_NET_ZPERF_SERVER=y
CONFIG_NET_ZPERF_MAX_PACKET_SIZE=1500
CONFIG_NET_MAX_CONTEXTS=8

# net_sock_svc needs one poll entry per socket service (zperf UDP+TCP listeners,
# DHCP, ...); the default of 3 is not enough and aborts the service thread.
CONFIG_ZVFS_POLL_MAX=16

# The zperf iperf2 server registers its listening sockets with the socket
# service dispatcher. Upstream's zperf sample uses a cooperative dispatcher
# thread priority and a deeper stack; the 2 KiB default is not enough for the
# poll plus the logging paths on this build.
CONFIG_NET_SOCKETS_SERVICE_THREAD_PRIO=-1
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_STACK_SENTINEL=y
# The interface up/down events run in the net_mgmt thread. The 1536 byte
# ARM64 default is not enough once the bench callbacks log.
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_MAX_CONN=8

# Static addressing: the bench port sits on the same L2 segment as the Pi.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.0.200"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.0.1"
CONFIG_NET_CONFIG_AUTO_INIT=y

# Statistics: generic + Ethernet + per-MMC-counter vendor keys.
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_PERIODIC_OUTPUT=n
CONFIG_NET_STATISTICS_ETHERNET=y
CONFIG_NET_STATISTICS_ETHERNET_VENDOR=y
CONFIG_NET_STATISTICS_USER_API=y

# One frame per net_buf: the near-MTU bench payload must not be fragmented
# inside the stack. The DWMAC driver requires a multiple of the 64-bit bus.
CONFIG_NET_BUF_FIXED_DATA_SIZE=y
CONFIG_NET_BUF_DATA_SIZE=1536

CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=192
CONFIG_NET_BUF_TX_COUNT=64

CONFIG_DWMAC_NB_RX_DESCS=64
CONFIG_DWMAC_NB_TX_DESCS=32

CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=4096

# Make sure the MAC is initialized (and the PHY reset is released) before the
# PHY driver probes the MDIO bus.
CONFIG_ETH_INIT_PRIORITY=60
CONFIG_PHY_INIT_PRIORITY=65

CONFIG_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_SHELL_CMDS_RESIZE=n

CONFIG_CACHE_MANAGEMENT=y
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_ETHERNET_LOG_LEVEL_INF=y
CONFIG_PHY_LOG_LEVEL_INF=y
